<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiLogistics - Client Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/main.css" />
</head>

<body>
    <div class="app-container">
        <div class="main-card">
            <!-- Header -->
            <div class="header">
                <div class="header-content">
                    <h1><i class="fas fa-truck"></i> SwiLogistics</h1>
                    <p>Professional Client Portal - Real-time Package Management</p>
                    <div>
                        <span id="connectionStatus" class="status-badge disconnected">
                            <i class="fas fa-circle"></i> Disconnected
                        </span>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Authentication Section -->
                <div id="authContainer"></div>
                
                <!-- Order Management Section -->
                <div id="orderContainer"></div>
                
                <!-- System Monitoring Section -->
                <div id="systemContainer"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="components/PrimaryButton.js"></script>
    <script src="components/InputField.js"></script>
    <script src="components/SelectField.js"></script>
    <script src="js/UIBuilder.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
